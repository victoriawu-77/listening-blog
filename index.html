  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #FAFAFA;
      --ink: #0A0A0A;
      --muted: #737373;
      --faint: #A3A3A3;
      --line: #E5E5E5;
      --line-soft: #F0F0F0;
      --coral: #FF3D1F;
      --blue: #2B5CFF;
      --magenta: #E11D8F;
      --teal: #00B894;
      --day: var(--teal);
      --night: var(--blue);
      --extra: var(--magenta);
      --accent: var(--coral);
      --radius: 8px;
      --max: 720px;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 52px 22px 120px;
    }

    header { margin-bottom: 40px; }
    .brand {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .mark {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      margin-top: 6px;
      color: var(--coral);
    }
    header h1 {
      font-family: Syne, "PingFang SC", "Noto Sans SC", sans-serif;
      font-weight: 700;
      font-size: clamp(1.75rem, 4.5vw, 2.15rem);
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin: 0 0 8px;
      color: var(--ink);
    }
    header .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }
    header .updated {
      margin: 12px 0 0;
      color: var(--faint);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .accent-bar {
      width: 48px;
      height: 4px;
      background: var(--coral);
      border-radius: 2px;
      margin-top: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 8;
      padding: 14px 0 12px;
      margin: 0 0 4px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line-soft);
    }
    .toolbar input {
      flex: 1 1 160px;
      min-width: 140px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .toolbar input::placeholder { color: var(--faint); }
    .toolbar input:focus { border-color: var(--ink); }
    .toolbar button, .days button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.84rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .toolbar button:hover, .days button:hover {
      border-color: var(--ink);
      color: var(--ink);
    }
    .toolbar button.active, .days button.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .toolbar button[data-quality].active {
      background: var(--coral);
      border-color: var(--coral);
      color: #fff;
    }

    .stats {
      color: var(--faint);
      font-size: 0.8rem;
      margin: 8px 0 16px;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    .note {
      border-left: 3px solid var(--coral);
      padding: 4px 0 4px 14px;
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 28px;
      line-height: 1.55;
      background: transparent;
    }
    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 36px;
    }

    .day-block { margin-bottom: 48px; }
    .day-block h2 {
      font-family: Syne, "PingFang SC", sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .day-block h2 span {
      font-family: "DM Sans", sans-serif;
      color: var(--faint);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      padding: 20px 0 18px;
      margin-bottom: 0;
      border-left: 3px solid transparent;
      padding-left: 14px;
      margin-left: -1px;
      transition: border-color .15s ease;
    }
    .card:hover { border-left-color: var(--ink); }
    .card.slot-day { border-left-color: var(--day); }
    .card.slot-night { border-left-color: var(--night); }
    .card.slot-extra { border-left-color: var(--extra); }
    .card.slot-day:hover { border-left-color: var(--day); }
    .card.slot-night:hover { border-left-color: var(--night); }
    .card.slot-extra:hover { border-left-color: var(--extra); }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .card h3 {
      margin: 0;
      font-family: Syne, "PingFang SC", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.35;
      flex: 1 1 220px;
    }
    .card h3 a {
      color: var(--ink);
      text-decoration: none;
    }
    .card h3 a:hover { color: var(--coral); }
    .meta {
      color: var(--faint);
      font-size: 0.75rem;
      margin: 8px 0 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;

    .badge {
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #fff;

    .badge.day { background: var(--day); }
    .badge.night { background: var(--night); }
    .badge.extra { background: var(--extra); }
    .badge.thin {
      background: transparent;
      color: var(--faint);
      border: 1px solid var(--line);
      font-weight: 500;
    }
    .badge.full { background: var(--coral); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .actions button, .actions a.btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.84rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .actions button.primary {
      background: var(--coral);
      color: #fff;
      border-color: var(--coral);
    }
    .actions button.primary:hover { filter: brightness(1.05); }
    .actions a.btn:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

      border-top: 1px solid var(--line-soft);

      aspect-ratio: 16 / 9;
      min-height: 200px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #111;
      margin-bottom: 16px;

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .detail p { margin: 0 0 10px; font-size: 0.95rem; color: var(--ink); }
    .detail .label {
      color: var(--coral);
      font-size: 0.7rem;
      margin-bottom: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .detail .pending {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .expr {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }
    .expr li {
      font-size: 0.9rem;
      margin-bottom: 6px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }
    .expr li:last-child { border-bottom: none; }
    .expr li strong {
      color: var(--coral);
      font-weight: 700;
    }
    .day-expr {
      margin-top: 18px;
      padding: 4px 0 0;
      border: none;
      border-top: 1px dashed var(--line);
      padding-top: 16px;
    }
    .day-expr h4 {
      margin: 0 0 8px;
      font-family: Syne, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    footer strong {
      color: var(--ink);
      font-weight: 600;
    }
    footer .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coral);
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 520px) {
      .wrap { padding: 36px 16px 96px; }
      header h1 { font-size: 1.55rem; }
      .card { padding-left: 12px; }
    }
  </style>

    const main = document.getElementById("main");
    const stats = document.getElementById("stats");
    const dayNav = document.getElementById("day-nav");
    const qInput = document.getElementById("q");
    let slot = "all";
    let onlyFull = false;
    let dayFilter = "all";
    let query = "";

    const slotLabel = { day: "Day", night: "Night", extra: "Extra" };
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    document.getElementById("updated-line").textContent =
      "Updated " + (DATA.updated || "");

    function fmtDateShort(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}`;
    }

    function fmtDateHeading(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}, ${y}`;
    }

    function matchItem(item, day) {
      if (slot !== "all" && item.slot !== slot) return false;
      if (onlyFull && item.summary_quality !== "full") return false;
      if (dayFilter !== "all" && day.date !== dayFilter) return false;
      if (query) {
        const hay = [item.title, item.channel, item.summary, item.why, item.difficulty, day.date].join(" ").toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function formatDuration(d) {
      if (d == null || d === "") return "duration TBD";
      const s = String(d).trim();
      const m = s.match(/^约\s*(\d+)\s*分钟$/);
      if (m) return `~${m[1]} min`;
      return s;
    }

    function embedSrc(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1`;
    }

    function iframeHtml(id) {
      return `<iframe src="${embedSrc(id)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    }

    function mountEmbed(box) {
      if (!box || box.querySelector("iframe")) return;
      const id = box.dataset.vid;
      if (!id) return;
      box.innerHTML = iframeHtml(id);
    }

    function clearEmbed(box) {
      if (box) box.innerHTML = "";
    }

    function render() {
      dayNav.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.textContent = "All dates";
      allBtn.className = dayFilter === "all" ? "active" : "";
      allBtn.onclick = () => { dayFilter = "all"; render(); };
      dayNav.appendChild(allBtn);

      let shown = 0;
      main.innerHTML = "";

      DATA.days.forEach(day => {
        const btn = document.createElement("button");
        btn.textContent = fmtDateShort(day.date);
        btn.className = dayFilter === day.date ? "active" : "";
        btn.onclick = () => { dayFilter = day.date; render(); };
        dayNav.appendChild(btn);

        const items = day.items.filter(it => matchItem(it, day));
        if (!items.length) return;

        const block = document.createElement("section");
        block.className = "day-block";
        block.id = "day-" + day.date;
        const h2 = document.createElement("h2");
        const approx = day.day_assignment && String(day.day_assignment).startsWith("approximate");
        h2.innerHTML = `${escapeHtml(fmtDateHeading(day.date))} <span>${items.length} item${items.length === 1 ? "" : "s"}` +
          (approx ? " · date approximate" : "") + `</span>`;
        block.appendChild(h2);

        items.forEach(item => {
          shown += 1;
          const card = document.createElement("article");
          card.className = "card slot-" + (item.slot || "");
          card.dataset.id = item.id;
          const thin = item.summary_quality !== "full";
          // Real Chinese summaries stay Chinese; thin/metadata-only get a short English note.
          const summaryBody = thin
            ? `<p class="pending">Summary still catching up — open the video meanwhile.</p>`
            : `<p>${escapeHtml(item.summary || "")}</p>`;
          const whyBlock = (!thin && item.why)
            ? `<p class="label">Why watch</p><p>${escapeHtml(item.why)}</p>`
            : "";
          const diffBlock = (!thin && item.difficulty)
            ? `<p class="label">English level</p><p>${escapeHtml(item.difficulty)}</p>`
            : "";
          card.innerHTML = `
            <div class="card-top">
              <div>
                <h3><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
                <p class="meta">${escapeHtml(item.channel)} · ${escapeHtml(formatDuration(item.duration))}` +
                  (item.published ? ` · ${escapeHtml(item.published)}` : "") + `</p>
              </div>
              <div class="badges">
                <span class="badge ${item.slot}">${slotLabel[item.slot] || item.slot}</span>
                <span class="badge ${thin ? "thin" : "full"}">${thin ? "Summary pending" : "Full summary"}</span>
              </div>
            </div>
            <div class="actions">
              <button type="button" class="primary" data-act="toggle">Collapse</button>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener">Open on YouTube</a>
            </div>
            <div class="detail open" id="d-${item.id}">
              <div class="video" data-vid="${escapeHtml(item.id)}"></div>
              <p class="label">Summary</p>
              ${summaryBody}
              ${whyBlock}
              ${diffBlock}
            </div>`;
          block.appendChild(card);
          // Mount embed immediately (default expanded)
          mountEmbed(card.querySelector(".video"));
        });

        if (day.expressions && day.expressions.length && items.length) {
          const ex = document.createElement("div");
          ex.className = "day-expr";
          ex.innerHTML = `<h4>Expressions</h4><ul class="expr">` +
            day.expressions.map(e => `<li><strong>${escapeHtml(e.en)}</strong> — ${escapeHtml(e.zh)}</li>`).join("") +
            `</ul>`;
          block.appendChild(ex);
        }

        main.appendChild(block);
      });

      const total = DATA.days.reduce((n,d)=>n+d.items.length,0);
      stats.textContent = `Showing ${shown} / ${total} · ${DATA.days.length} days`;
    }

    main.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act=toggle]");
      if (!btn) return;
      const card = btn.closest(".card");
      const detail = card.querySelector(".detail");
      const open = detail.classList.toggle("open");
      btn.textContent = open ? "Collapse" : "Expand";
      const box = detail.querySelector(".video");
      if (open) {
        mountEmbed(box);
      } else {
        clearEmbed(box);
      }
    });

    document.querySelectorAll(".toolbar button[data-slot]").forEach(b => {
      b.addEventListener("click", () => {
        slot = b.dataset.slot;
        document.querySelectorAll(".toolbar button[data-slot]").forEach(x => x.classList.toggle("active", x === b));
        render();
      });
    });
    document.querySelector(".toolbar button[data-quality]").addEventListener("click", (e) => {
      onlyFull = !onlyFull;
      e.currentTarget.classList.toggle("active", onlyFull);
      render();
    });
    qInput.addEventListener("input", () => {
      query = qInput.value.trim().toLowerCase();
      render();
    });

    render();
  </script>
</body>
</html>
