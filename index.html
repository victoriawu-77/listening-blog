<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Victoria’s Listening Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Particle cream ground + charcoal type + distinct band accents */
      --bg: #F2F0E6;
      --ink: #171715;
      --muted: #4E4C46;
      --faint: #7A776C;
      --soft: #FFFFFF;
      --field: #D4CBB8;
      --field-edge: #A89E8C;
      --soft-2: #C9BFAC;
      --line: #E4E0D2;
      --yellow: #F7CC00; /* voltage gold — CTA and active */
      --coral: #EF6B00;  /* burnt orange */
      --red: #E10600;    /* ruby */
      --lime: #C6F000;   /* bright yellow-green */
      --teal: #128A45;   /* deep forest */
      --blue: #1A4DFF;   /* royal blue */
      --magenta: #C026D3; /* purple / magenta */
      --day: var(--coral);
      --night: var(--blue);
      --extra: var(--magenta);
      --gap: 52px;
      --r-card: 18px;
      --r-pill: 999px;
      --r-soft: 14px;
      --r-media: 16px;
      --serif: "Lora", "Palatino Linotype", "Songti SC", serif;
      --sans: "DM Sans", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    }

    /* Hide ugly scrollbars; still scrollable */
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 8;
      background: rgba(242, 240, 230, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 36px 12px;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 22px;
    }
    .logo {
      display: inline-block;
      flex: 0 0 auto;
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1;
      margin: 0 8px 0 0;
      color: var(--ink);
      background: transparent;
      padding: 0;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 22px;
      margin-top: 12px;
    }
    .slot-nav {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 18px;
      margin: 0;
    }
    .slot-nav button,
    .date-toggle,
    .date-reset {
      appearance: none;
      display: inline-block;
      width: auto;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--muted);
      font-family: inherit;
      font-weight: 400;
      cursor: pointer;
      padding: 4px 0 6px;
    }
    .slot-nav button { font-size: 1.2rem; padding: 8px 0 10px; }
    .slot-nav button:hover,
    .date-toggle:hover,
    .date-reset:hover {
      background: transparent;
      color: var(--ink);
    }
    .slot-nav button.active,
    .slot-nav button[data-quality].active {
      background: transparent;
      color: var(--ink);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--yellow);
    }

    .topbar input#q {
      flex: 0 1 180px;
      min-width: 120px;
      margin-left: auto;
      width: 180px;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      border-radius: 0;
      padding: 6px 0 5px;
      font-size: 0.84rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }
    .topbar input#q::placeholder { color: var(--faint); }
    .topbar input#q:focus {
      background: transparent;
      border-bottom-color: var(--ink);
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      position: relative;
    }
    .date-toggle { color: var(--muted); font-size: 1.15rem; font-weight: 500; padding: 8px 0 10px; }
    .date-control.is-set .date-toggle {
      color: var(--ink);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--yellow);
    }
    .date-reset {
      font-size: 1.25rem;
      line-height: 1;
      padding: 0 2px 4px;
      color: var(--faint);
    }
    .date-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
    }

    .shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 36px 96px;
    }

    /* —— Main column —— */
    .main-col { min-width: 0; }

    .hero {
      margin-bottom: 56px;
    }
    .hero-frame {
      border: none;
      padding: 4px 0 0;
      border-radius: 0;
      background: transparent;
    }
    .hero-lede {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: clamp(3.15rem, 6.2vw, 5.35rem);
      line-height: 1.05;
      letter-spacing: -0.012em;
      color: var(--ink);
      max-width: 11em;
    }
    .hero-line {
      margin: 14px 0 0;
      font-family: var(--serif);
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: clamp(1.7rem, 3.1vw, 2.55rem);
      line-height: 1.16;
      letter-spacing: -0.008em;
      color: var(--ink);
      max-width: 16em;
    }

    /* —— Day blocks: space + type, no heavy rule —— */
    .day-block { margin-bottom: 80px; }
    .day-block h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: clamp(2.4rem, 4.4vw, 3.55rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
      margin: 0 0 28px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 0;
      border-bottom: none;
      cursor: pointer;
      width: fit-content;
      max-width: 100%;
    }
    .day-chev {
      width: 0.42em;
      height: 0.42em;
      border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: translateY(-0.15em) rotate(45deg);
      opacity: 0.4;
      flex: 0 0 auto;
    }
    .day-block.is-collapsed .day-chev { transform: translateY(0.12em) rotate(-135deg); }
    .day-block.is-collapsed { margin-bottom: 36px; }
    .day-block.is-collapsed .day-body,
    .day-block.is-collapsed h2 { margin-bottom: 0; }
    .day-block.is-collapsed .day-body { display: none; }
    .day-block h2 span {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* —— Soft rounded cards: filled surface, no left bars —— */
    .card {
      position: relative;
      background: var(--soft);
      border: none;
      border-radius: 22px;
      padding: 22px 24px 20px;
      margin: 0 0 22px;
      border-left: none;
    }
    .card.slot-day,
    .card.slot-night,
    .card.slot-extra { border-left: none; }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }
    .slot-chip, .quality-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0;
      border-radius: 0;
      background: none;
      font-family: var(--sans);
      border: none;
    }
    .slot-chip.day { color: var(--day); }
    .slot-chip.night { color: var(--night); }
    .slot-chip.extra { color: var(--extra); }
    .quality-chip.full { color: var(--teal); }
    .quality-chip.thin {
      color: var(--faint);
      background: none;
      border: none;
      font-weight: 600;
    }

    .card h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.65rem, 2.4vw, 2.15rem);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -0.008em;
      line-height: 1.22;
      max-width: 22em;
    }
    .card h3 a {
      color: var(--ink);
      text-decoration: none;
    }
    .card h3 a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--yellow);
      text-underline-offset: 4px;
    }

    .meta {
      margin: 10px 0 0;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
    }

    .dek {
      margin: 14px 0 0;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--ink);
      max-width: 40em;
    }
    .dek.pending {
      color: var(--muted);
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .actions button, .actions a.btn {
      appearance: none;
      border: none;
      background: #fff;
      color: var(--ink);
      border-radius: var(--r-pill);
      padding: 8px 16px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background .12s ease, color .12s ease;
    }
    .actions button.primary {
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 18px;
    }
    .actions button.primary:hover {
      background: var(--ink);
      color: var(--yellow);
    }
    .actions a.btn:hover {
      background: var(--yellow);
      color: var(--ink);
    }

    .detail {
      display: none;
      margin-top: 18px;
    }
    .detail.open { display: block; }
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      overflow: hidden;
      background: #111;
      margin-bottom: 18px;
      border: none;
      border-radius: var(--r-media);
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .detail p { margin: 0 0 0.9em; font-size: 0.95rem; color: var(--ink); line-height: 1.75; }
    .detail p:last-child { margin-bottom: 0; }
    .detail ol.points {
      margin: 0.2em 0 0.4em;
      padding: 0 0 0 1.35em;
      line-height: 1.75;
    }
    .detail ol.points li {
      margin: 0 0 0.75em;
      padding: 0;
    }
    .detail ol.points li:last-child { margin-bottom: 0; }
    .detail .label {
      display: block;
      color: var(--muted);
      background: none;
      font-size: 0.72rem;
      margin: 18px 0 6px;
      padding: 0;
      border-radius: 0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .detail .label.why,
    .detail .label.level { background: none; color: var(--muted); }
    .detail .label:first-of-type { margin-top: 0; }
    .detail .pending {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .expr {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
    }
    .expr-card {
      border: none;
      border-radius: 16px;
      padding: 16px 18px 15px;
      background: var(--soft);
    }
    .expr-card:nth-child(even) { background: #E7E1D2; }
    .expr-en {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.12rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--ink);
    }
    .expr-zh {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--muted);
    }
    .day-expr {
      margin-top: 8px;
      padding-top: 0;
      border-top: none;
    }
    .day-expr h4 {
      margin: 0 0 12px;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.4vw, 2rem);
      font-weight: 500;
      font-optical-sizing: auto;
      font-style: italic;
      letter-spacing: -0.008em;
      line-height: 1.15;
    }

    footer {
      margin-top: 64px;
      padding-top: 8px;
      border-top: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      color: var(--faint);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer strong {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
      font-weight: 400;
      letter-spacing: 0;
    }
    footer .mark-sq {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: var(--r-pill);
      background: var(--yellow);
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 800px) {
      .topbar-inner { padding: 14px 18px 10px; }
      .topbar-row { gap: 8px 14px; }
      .topbar input#q { margin-left: 0; flex: 1 1 140px; }
      .filter-row { margin-top: 8px; }
      .date-control { margin-left: 0; }
      .shell { padding: 28px 18px 80px; }
      .hero { margin-bottom: 36px; }
      .hero-frame { padding: 0; }
      .hero-lede { font-size: 2.65rem; max-width: none; }
      .hero-line { font-size: 1.45rem; max-width: none; }
      .day-block h2 { font-size: 2.15rem; }
      .card { margin-bottom: 16px; padding: 18px; }
      .expr { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="logo">VW</div>
        <input id="q" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div class="filter-row">
        <nav class="slot-nav" aria-label="Filters">
          <button type="button" data-slot="all" class="active">All</button>
          <button type="button" data-slot="day">Day</button>
          <button type="button" data-slot="night">Night</button>
          <button type="button" data-slot="extra">Extra</button>
          <button type="button" data-quality="full">Full summaries</button>
        </nav>
        <div class="date-control">
          <button type="button" class="date-toggle" id="date-toggle">Pick a date</button>
          <button type="button" class="date-reset" id="date-reset" hidden aria-label="Any day">×</button>
          <input class="date-input" id="date-input" type="date" aria-label="Choose a date" />
        </div>
      </div>
    </div>
  </header>
  <div class="shell">
    <div class="main-col">
      <header class="hero">
        <div class="hero-frame">
          <h1 class="hero-lede">Victoria’s Listening Log</h1>
          <p class="hero-line">English tech talks by day, podcasts by night.</p>
        </div>
      </header>

      <main id="main"></main>

      <footer>
        <div><span class="mark-sq" aria-hidden="true"></span><strong>Listen clean. Watch sharp.</strong></div>
      </footer>
    </div>
  </div>

刻」，但会逐步取代网页表单和很多手机 App，真正护城河是品牌/履约/选品；⑧ 迭代部署是唯一靠谱路径；企业多数仍是 AI 用得不够；讨厌用 tokens 计价但客户要可预期；好模型要会科学发现，也要「好共事」——像会认真反驳却仍尊重你的资深同事。", "why": "「agent teams」与「agent 取代表单/App」和 Happycapy 的 agent-native computer 方向直接相关。", "difficulty": "中等。聊得比较放松，Sam 语速偏快，John 是爱尔兰口音。", "expressions": [], "summary_quality": "full"}, {"id": "EZcWEsMuLb4", "url": "https://www.youtube.com/watch?v=EZcWEsMuLb4", "title": "Taking on ServiceNow: Coding Agents for the Rest of Us with Serval Co-Founder and CEO Jake Stauch", "channel": "No Priors: AI, Machine Learning, Tech, & Startups", "duration": "约 38 分钟", "published": "2026-10-29", "slot": "extra", "summary": "Serval 的 CEO Jake Stauch 讲他们怎么把 coding agent 交给企业 IT 团队，让不写代码的人也能搭东西，同时靠确定性的审批流程和审计记录管住权限。他的判断是 SaaS 不会崩，更可能迎来一轮整合；后台自动运行的 agent 在企业里目前还算 moonshot。", "why": "企业里「给非工程师用 agent + 审批审计」的产品形态可参考。", "difficulty": "中等。美式口音，语速平稳，商业词汇比较多。", "expressions": [], "summary_quality": "full"}], "expressions": [{"en": "first-pass review", "zh": "第一轮初审，之后还会有人复核"}, {"en": "dark software factory", "zh": "几乎不需要人在场、全自动运转的软件工厂；说法来自 lights-out factory（熄灯工厂）"}, {"en": "test-time compute", "zh": "模型在推理、回答问题时额外投入的算力"}, {"en": "system of record", "zh": "企业里作为权威数据来源的核心系统，比如 ServiceNow、Salesforce"}, {"en": "SaaS-pocalypse", "zh": "SaaS 和 apocalypse 拼成的词，指 AI 会让传统 SaaS 遭遇末日的说法"}], "day_assignment": "confirmed"}, {"date": "2026-10-29", "items": [{"id": "hnCoQ5wB-GU", "url": "https://www.youtube.com/watch?v=hnCoQ5wB-GU", "title": "I tested 4 AI agents on 9 real tasks. Here’s who won.", "channel": "How I AI", "duration": "约 35 分钟", "published": "2026-10-28", "slot": "day", "summary": "Claire Vo（How I AI）谈 personal-agent fatigue，横评 Grok Bot、ChatGPT Dot、Meta Muse、Claude Duet。用 9 个真实任务打分：回 Slack、修 Sentry bug、Figma 缩略图、收件箱、家庭小报、四年级物理题、买鞋、发布视频等；还用 computer use 让一个 agent 去操作这些 agent 再打分。", "why": "Happycapy 竞品实测，评测任务设计可参考。", "difficulty": "中等。", "expressions": [], "summary_quality": "full"}, {"id": "9v42ZOdiBJY", "url": "https://www.youtube.com/watch?v=9v42ZOdiBJY", "title": "Why     const main = document.getElementById("main");
    const qInput = document.getElementById("q");
    const dateToggle = document.getElementById("date-toggle");
    const dateReset = document.getElementById("date-reset");
    const dateInput = document.getElementById("date-input");
    const DAY_KEY = "victoria-listening-day-folds";
    let slot = "all";
    let onlyFull = false;
    let dayFilter = "all";
    let query = "";

    const slotLabel = { day: "Day", night: "Night", extra: "Extra" };
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function fmtDateShort(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}`;
    }

    function fmtDateHeading(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}, ${y}`;
    }

    function matchItem(item, day) {
      if (slot !== "all" && item.slot !== slot) return false;
      if (onlyFull && item.summary_quality !== "full") return false;
      if (dayFilter !== "all" && day.date !== dayFilter) return false;
      if (query) {
        const hay = [item.title, item.channel, item.summary, item.why, item.difficulty, day.date].join(" ").toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function formatDuration(d) {
      if (d == null || d === "") return "duration TBD";
      const s = String(d).trim();
      const m = s.match(/^约\s*(\d+)\s*分钟$/);
      if (m) return `~${m[1]} min`;
      return s;
    }

    function embedSrc(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1`;
    }

    function iframeHtml(id) {
      return `<iframe src="${embedSrc(id)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    }

    function mountEmbed(box) {
      if (!box || box.querySelector("iframe")) return;
      const id = box.dataset.vid;
      if (!id) return;
      box.innerHTML = iframeHtml(id);
    }

    function clearEmbed(box) {
      if (box) box.innerHTML = "";
    }


    const CIRCLED = /[\u2460-\u2473]/;

    function stripEdgePunct(s) {
      return String(s || "").trim().replace(/^[：:.\s]+/, "").replace(/[：:；;\s]+$/, "");
    }

    function splitEnumerated(text) {
      const re = /(?:^|\s)(\d{1,2})[.、．)）]\s+/g;
      const marks = [];
      let m;
      while ((m = re.exec(text))) {
        const num = Number(m[1]);
        if (num < 1 || num > 30) continue;
        marks.push({ index: m.index + (m[0].startsWith(" ") || m[0].startsWith("\n") ? 1 : 0), len: m[0].length - (m[0].startsWith(" ") ? 1 : 0) });
      }
      if (marks.length < 2) return null;
      const lead = stripEdgePunct(text.slice(0, marks[0].index));
      const items = [];
      for (let i = 0; i < marks.length; i++) {
        const start = marks[i].index + marks[i].len;
        const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
        const body = stripEdgePunct(text.slice(start, end));
        if (body) items.push(body);
      }
      return items.length ? { lead, items } : null;
    }

    function splitCircled(text) {
      if (!CIRCLED.test(text)) return null;
      const chunks = text.split(/(?=[\u2460-\u2473])/);
      let lead = "";
      const items = [];
      chunks.forEach(chunk => {
        if (CIRCLED.test(chunk.charAt(0))) {
          const body = stripEdgePunct(chunk.slice(1));
          if (body) items.push(body);
        } else {
          lead = stripEdgePunct(chunk);
        }
      });
      return items.length ? { lead, items } : null;
    }

    function splitSentences(text) {
      const parts = text.split(/(?<=[。！？])/).map(s => s.trim()).filter(Boolean);
      const paras = [];
      parts.forEach(sentence => {
        if (sentence.length > 140 && (sentence.match(/；/g) || []).length >= 2) {
          sentence.split("；").map(s => s.trim()).filter(Boolean).forEach((bit, i, arr) => {
            paras.push(i < arr.length - 1 ? bit + "；" : bit);
          });
        } else {
          paras.push(sentence);
        }
      });
      return paras;
    }

    function formatRich(raw) {
      const text = String(raw || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      const listed = splitCircled(text) || splitEnumerated(text);
      if (listed) {
        let html = "";
        if (listed.lead) html += `<p>${escapeHtml(listed.lead)}</p>`;
        html += `<ol class="points">` + listed.items.map(item => `<li>${escapeHtml(item)}</li>`).join("") + `</ol>`;
        return html;
      }
      const paras = splitSentences(text);
      if (paras.length >= 3 || (text.length > 160 && paras.length > 1)) {
        return paras.map(p => `<p>${escapeHtml(p)}</p>`).join("");
      }
      return `<p>${escapeHtml(text)}</p>`;
    }

    function summaryDek(item, thin) {
      if (thin) return `<p class="dek pending">Summary still catching up — open the video meanwhile.</p>`;
      const raw = String(item.summary || "").trim();
      const listed = splitCircled(raw);
      let dek = listed && listed.lead ? listed.lead : raw;
      if (!listed) {
        const parts = raw.split(/(?<=[。！？.!?])\s*/).filter(Boolean);
        if (parts.length > 2) dek = parts.slice(0, 2).join("");
      }
      return `<p class="dek">${escapeHtml(dek)}</p>`;
    }

    function readClosedDays() {
      try {
        const parsed = JSON.parse(localStorage.getItem(DAY_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function writeClosedDays(map) {
      try { localStorage.setItem(DAY_KEY, JSON.stringify(map)); } catch (e) {}
    }

    function syncDateLabel() {
      const control = dateToggle.closest(".date-control");
      if (dayFilter === "all") {
        dateToggle.textContent = "Pick a date";
        dateReset.hidden = true;
        dateInput.value = "";
        control.classList.remove("is-set");
      } else {
        dateToggle.textContent = fmtDateShort(dayFilter);
        dateReset.hidden = false;
        dateInput.value = dayFilter;
        control.classList.add("is-set");
      }
    }

    function render() {
      syncDateLabel();
      main.innerHTML = "";
      const closedDays = readClosedDays();

      DATA.days.forEach(day => {
        const items = day.items.filter(it => matchItem(it, day));
        if (!items.length) return;

        const closed = !!closedDays[day.date];
        const block = document.createElement("section");
        block.className = "day-block" + (closed ? " is-collapsed" : "");
        block.id = "day-" + day.date;
        const h2 = document.createElement("h2");
        const approx = day.day_assignment && String(day.day_assignment).startsWith("approximate");
        h2.innerHTML = escapeHtml(fmtDateHeading(day.date)) +
          (approx ? ` <span>Date approximate</span>` : "") +
          `<span class="day-chev" aria-hidden="true"></span>`;
        h2.tabIndex = 0;
        h2.setAttribute("role", "button");
        h2.setAttribute("aria-expanded", closed ? "false" : "true");
        h2.setAttribute("aria-controls", "body-" + day.date);
        block.appendChild(h2);
        const body = document.createElement("div");
        body.className = "day-body";
        body.id = "body-" + day.date;
        block.appendChild(body);

        items.forEach(item => {
          const card = document.createElement("article");
          card.className = "card slot-" + (item.slot || "");
          card.dataset.id = item.id;
          const thin = item.summary_quality !== "full";
          const whyBlock = (!thin && item.why)
            ? `<p class="label why">Why watch</p>${formatRich(item.why)}`
            : "";
          const diffBlock = (!thin && item.difficulty)
            ? `<p class="label level">English level</p>${formatRich(item.difficulty)}`
            : "";
          const fullSummaryBlock = (!thin && item.summary)
            ? formatRich(item.summary)
            : (thin ? `<p class="pending">Summary still catching up — open the video meanwhile.</p>` : "");
          card.innerHTML = `
            <div class="card-head">
              <span class="slot-chip ${item.slot}" aria-label="${slotLabel[item.slot] || item.slot}">${slotLabel[item.slot] || item.slot}</span>
              <span class="quality-chip ${thin ? "thin" : "full"}">${thin ? "Pending" : "Full"}</span>
            </div>
            <h3><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
            <p class="meta">${escapeHtml(item.channel)} · ${escapeHtml(formatDuration(item.duration))}` +
              (item.published ? ` · ${escapeHtml(item.published)}` : "") + `</p>
            ${summaryDek(item, thin)}
            <div class="actions">
              <button type="button" class="primary" data-act="toggle">Collapse</button>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener">Open on YouTube ↗</a>
            </div>
            <div class="detail open" id="d-${item.id}">
              <div class="video" data-vid="${escapeHtml(item.id)}"></div>
              ${fullSummaryBlock}
              ${whyBlock}
              ${diffBlock}
            </div>`;
          body.appendChild(card);
          mountEmbed(card.querySelector(".video"));
        });

        if (day.expressions && day.expressions.length && items.length) {
          const ex = document.createElement("div");
          ex.className = "day-expr";
          ex.innerHTML = `<h4>Expressions</h4><div class="expr">` +
            day.expressions.map(e => `<article class="expr-card"><p class="expr-en">${escapeHtml(e.en)}</p><p class="expr-zh">${escapeHtml(e.zh)}</p></article>`).join("") +
            `</div>`;
          body.appendChild(ex);
        }

        main.appendChild(block);
      });

    }

    function toggleDay(heading) {
      const block = heading.closest(".day-block");
      const date = (block.id || "").replace(/^day-/, "");
      const closed = !block.classList.contains("is-collapsed");
      block.classList.toggle("is-collapsed", closed);
      heading.setAttribute("aria-expanded", closed ? "false" : "true");
      const map = readClosedDays();
      if (closed) map[date] = true;
      else delete map[date];
      writeClosedDays(map);
    }

    main.addEventListener("click", (e) => {
      const heading = e.target.closest(".day-block h2");
      if (heading) {
        toggleDay(heading);
        return;
      }
      const btn = e.target.closest("button[data-act=toggle]");
      if (!btn) return;
      const card = btn.closest(".card");
      const detail = card.querySelector(".detail");
      const open = detail.classList.toggle("open");
      btn.textContent = open ? "Collapse" : "Expand";
      const box = detail.querySelector(".video");
      if (open) {
        mountEmbed(box);
      } else {
        clearEmbed(box);
      }
    });

    document.querySelectorAll(".slot-nav button[data-slot]").forEach(b => {
      b.addEventListener("click", () => {
        slot = b.dataset.slot;
        document.querySelectorAll(".slot-nav button[data-slot]").forEach(x => x.classList.toggle("active", x === b));
        render();
      });
    });
    document.querySelector(".slot-nav button[data-quality]").addEventListener("click", (e) => {
      onlyFull = !onlyFull;
      e.currentTarget.classList.toggle("active", onlyFull);
      render();
    });
    qInput.addEventListener("input", () => {
      query = qInput.value.trim().toLowerCase();
      render();
    });

    const knownDates = DATA.days.map(d => d.date).sort();
    if (knownDates.length) {
      dateInput.min = knownDates[0];
      dateInput.max = knownDates[knownDates.length - 1];
    }
    dateToggle.addEventListener("click", () => {
      if (typeof dateInput.showPicker === "function") {
        try { dateInput.showPicker(); return; } catch (e) {}
      }
      dateInput.focus();
    });
    dateInput.addEventListener("change", () => {
      dayFilter = dateInput.value || "all";
      render();
    });
    dateReset.addEventListener("click", () => {
      dayFilter = "all";
      render();
    });
    main.addEventListener("keydown", (e) => {
      const heading = e.target.closest(".day-block h2");
      if (!heading) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleDay(heading);
      }
    });

    render();

  </script>
