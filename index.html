<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Victoria’s Listening Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script>
    /* Default open. Collapse only when a saved preference says so. */
    try {
      if (localStorage.getItem("victoria-listening-sidebar") === "collapsed") {
        document.documentElement.classList.add("side-collapsed");
      }
    } catch (e) {}
  </script>
  <style>
    :root {
      /* Particle cream ground + charcoal type + distinct band accents */
      --bg: #F2F0E6;
      --ink: #171715;
      --muted: #4E4C46;
      --faint: #7A776C;
      --soft: #FFFFFF;
      --field: #D4CBB8;
      --field-edge: #A89E8C;
      --soft-2: #C9BFAC;
      --line: #E4E0D2;
      --yellow: #F7CC00; /* voltage gold — CTA and active */
      --coral: #EF6B00;  /* burnt orange */
      --red: #E10600;    /* ruby */
      --lime: #C6F000;   /* bright yellow-green */
      --teal: #128A45;   /* deep forest */
      --blue: #1A4DFF;   /* royal blue */
      --magenta: #C026D3; /* purple / magenta */
      --day: var(--coral);
      --night: var(--blue);
      --extra: var(--magenta);
      --side: 210px;
      --rail: 48px;
      --gap: 52px;
      --r-card: 18px;
      --r-pill: 999px;
      --r-soft: 14px;
      --r-media: 16px;
      --serif: "Instrument Serif", "Times New Roman", "Songti SC", serif;
      --sans: "DM Sans", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    }

    /* Hide ugly scrollbars; still scrollable */
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
    }

    /* —— Two-column shell —— */
    .shell {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      gap: var(--gap);
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 36px 96px;
      align-items: start;
    }

    /* —— Sticky left sidebar: soft fills, no stroked panels —— */
    .sidebar {
      position: sticky;
      top: 28px;
      align-self: start;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .side-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .side-toggle {
      appearance: none;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      margin-top: 2px;
      padding: 0;
      border: none;
      border-radius: var(--r-pill);
      background: var(--soft);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .side-toggle:hover { background: var(--yellow); }
    html.side-collapsed .side-toggle {
      background: var(--yellow);
      color: var(--ink);
    }
    html.side-collapsed .side-toggle:hover {
      background: var(--ink);
      color: var(--yellow);
    }
    .side-toggle:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 2px;
    }
    .side-toggle-icon { display: block; }
    .logo {
      display: inline-block;
      font-family: var(--serif);
      font-size: 1.65rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 6px;
      color: var(--ink);
      background: var(--yellow);
      padding: 8px 12px 6px;
      border-radius: 14px;
    }
    .logo em { font-style: italic; color: var(--ink); }
    .side-kicker {
      margin: 0 0 22px;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
    }
    .side-label {
      margin: 22px 0 10px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
      /* space + type only — no rule */
      border: none;
      padding-top: 0;
    }

    .slot-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 14px;
    }
    .slot-nav button {
      appearance: none;
      display: block;
      width: 100%;
      text-align: left;
      background: var(--field);
      border: 1px solid var(--field-edge);
      border-radius: var(--r-pill);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 500;
      padding: 9px 14px;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background .12s ease, color .12s ease;
    }
    .slot-nav button:hover {
      background: var(--soft);
      color: var(--ink);
    }
    .slot-nav button.active {
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
    }
    .slot-nav button[data-quality].active {
      background: var(--yellow);
      color: var(--ink);
    }

    .sidebar input#q {
      width: 100%;
      border: 1px solid var(--field-edge);
      background: var(--field);
      border-radius: var(--r-pill);
      padding: 10px 14px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      margin: 8px 0 4px;
    }
    .sidebar input#q::placeholder { color: var(--faint); }
    .sidebar input#q:focus {
      background: var(--soft-2);
      border-color: var(--ink);
    }

    .day-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0 0 16px;
    }
    .day-nav button {
      appearance: none;
      display: block;
      width: 100%;
      text-align: left;
      background: var(--field);
      border: 1px solid var(--field-edge);
      border-radius: var(--r-pill);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 8px 14px;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .day-nav button:hover {
      background: var(--soft);
      color: var(--ink);
    }
    .day-nav button.active {
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
    }

    /* Collapsed: slim rail, filters one click away, main takes the width */
    html.side-collapsed .shell {
      grid-template-columns: var(--rail) minmax(0, 1fr);
      gap: 28px;
    }
    html.side-collapsed .sidebar {
      padding-right: 0;
      overflow: visible;
    }
    html.side-collapsed .side-head { display: block; }
    html.side-collapsed .side-brand,
    html.side-collapsed .sidebar-panel { display: none; }
    html.side-collapsed .side-toggle-icon { transform: rotate(180deg); }

    /* —— Main column —— */
    .main-col { min-width: 0; }

    .hero {
      margin-bottom: 56px;
    }
    .hero-frame {
      border: none;
      padding: 4px 0 0;
      border-radius: 0;
      background: transparent;
    }
    .hero-lede {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(3.15rem, 6.2vw, 5.35rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      color: var(--ink);
      max-width: 11em;
    }
    .hero-lede em {
      font-style: italic;
      font-weight: 400;
    }
    /* small accent mark only — not a full-width bar */
    .yellow-bar {
      display: none;
    }

    .note {
      margin: 0 0 56px;
      padding: 14px 18px;
      border: none;
      border-radius: var(--r-soft);
      background: var(--soft);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    /* —— Day blocks: space + type, no heavy rule —— */
    .day-block { margin-bottom: 80px; }
    .day-block h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.4rem, 4.4vw, 3.55rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 28px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 0;
      border-bottom: none;
    }
    .day-block h2 span {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* —— Soft rounded cards: filled surface, no left bars —— */
    .card {
      position: relative;
      background: var(--soft);
      border: none;
      border-radius: 22px;
      padding: 22px 24px 20px;
      margin: 0 0 22px;
      border-left: none;
    }
    .card.slot-day,
    .card.slot-night,
    .card.slot-extra { border-left: none; }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }
    .slot-chip, .quality-chip {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-family: var(--sans);
      border: none;
    }
    .slot-chip.day { background: var(--day); color: var(--ink); }
    .slot-chip.night { background: var(--night); color: #fff; }
    .slot-chip.extra { background: var(--extra); color: #fff; }
    .quality-chip.full { background: var(--lime); color: var(--ink); }
    .quality-chip.thin {
      background: var(--field);
      color: var(--muted);
      border: 1px solid var(--field-edge);
      font-weight: 600;
    }

    .card h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.65rem, 2.4vw, 2.15rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.08;
      max-width: 22em;
    }
    .card h3 a {
      color: var(--ink);
      text-decoration: none;
    }
    .card h3 a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--yellow);
      text-underline-offset: 4px;
    }

    .meta {
      margin: 10px 0 0;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
    }

    .dek {
      margin: 14px 0 0;
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--ink);
      max-width: 40em;
    }
    .dek.pending {
      color: var(--muted);
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .actions button, .actions a.btn {
      appearance: none;
      border: none;
      background: #fff;
      color: var(--ink);
      border-radius: var(--r-pill);
      padding: 8px 16px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background .12s ease, color .12s ease;
    }
    .actions button.primary {
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 18px;
    }
    .actions button.primary:hover {
      background: var(--ink);
      color: var(--yellow);
    }
    .actions a.btn:hover {
      background: var(--yellow);
      color: var(--ink);
    }

    .detail {
      display: none;
      margin-top: 18px;
    }
    .detail.open { display: block; }
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      overflow: hidden;
      background: #111;
      margin-bottom: 18px;
      border: none;
      border-radius: var(--r-media);
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .detail p { margin: 0 0 10px; font-size: 0.95rem; color: var(--ink); line-height: 1.65; }
    .detail .label {
      display: inline-block;
      color: var(--bg);
      background: var(--teal);
      font-size: 0.68rem;
      margin: 16px 0 8px;
      padding: 6px 10px;
      border-radius: var(--r-pill);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .detail .label.why { background: var(--red); }
    .detail .label.level { background: var(--blue); }
    .detail .label:first-of-type { margin-top: 0; }
    .detail .pending {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .expr {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }
    .expr li {
      font-size: 0.9rem;
      margin-bottom: 8px;
      padding: 12px 16px;
      border-bottom: none;
      background: var(--bg);
      border-radius: var(--r-soft);
    }
    .expr li:last-child { border-bottom: none; }
    .expr li strong { color: var(--ink); font-weight: 700; }
    .day-expr {
      margin-top: 8px;
      padding-top: 0;
      border-top: none;
    }
    .day-expr h4 {
      margin: 0 0 12px;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.4vw, 2rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1;
    }

    footer {
      margin-top: 64px;
      padding-top: 8px;
      border-top: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      color: var(--faint);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer strong {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
      font-weight: 400;
      letter-spacing: 0;
    }
    footer .mark-sq {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: var(--r-pill);
      background: var(--yellow);
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 800px) {
      .shell,
      html.side-collapsed .shell {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 28px 18px 80px;
      }
      .sidebar {
        position: static;
        max-height: none;
        overflow: visible;
        border-bottom: none;
        padding-bottom: 8px;
      }
      .side-toggle { display: none; }
      html.side-collapsed .side-brand,
      html.side-collapsed .sidebar-panel { display: block; }
      .side-head { display: block; }
      .slot-nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      .slot-nav button {
        width: auto;
        background: var(--field);
        padding: 8px 14px;
      }
      .slot-nav button.active { background: var(--yellow); }
      .day-nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      .day-nav button {
        width: auto;
        background: var(--field);
        padding: 7px 12px;
      }
      .day-nav button.active { background: var(--yellow); }
      .hero { margin-bottom: 36px; }
      .hero-frame { padding: 0; }
      .hero-lede { font-size: 2.65rem; max-width: none; }
      .day-block h2 { font-size: 2.15rem; }
      .card { margin-bottom: 16px; padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="side-head">
        <div class="side-brand">
          <div class="logo">V<em>W</em></div>
        </div>
        <button type="button" class="side-toggle" id="side-toggle" aria-expanded="true" aria-controls="sidebar-panel" aria-label="Hide filters">
          <svg class="side-toggle-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="sidebar-panel" id="sidebar-panel">

      <nav class="slot-nav">
        <button type="button" data-slot="all" class="active">All</button>
        <button type="button" data-slot="day">Day</button>
        <button type="button" data-slot="night">Night</button>
        <button type="button" data-slot="extra">Extra</button>
        <button type="button" data-quality="full">Full summaries</button>
      </nav>

      <input id="q" type="search" placeholder="Search…" autocomplete="off" />

      <nav class="day-nav" id="day-nav"></nav>
      </div>
    </aside>

    <div class="main-col">
      <header class="hero">
        <div class="hero-frame">
          <p class="hero-lede">Victoria’s <em>Listening</em> Log — English tech talks by <em>day</em>, podcasts by <em>night</em>.</p>
        </div>
      </header>

      <p class="note">
        Oct 29–30 have full Chinese summaries; earlier days are still catching up. Videos are expanded by default — collapse any you don’t need.
      </p>

      <main id="main"></main>

      <footer>
        <div><span class="mark-sq" aria-hidden="true"></span><strong>Listen clean. Watch sharp.</strong></div>
      </footer>
    </div>
  </div>

  <script>
    const DATA = {"title": "Victoria 的科技英文视听博客", "updated": "2026-10-30", "source": "Lenny daily English listening routine + conversation summaries", "days": [{"date": "2026-10-30", "items": [{"id": "AnsXWH2_EBU", "url": "https://www.youtube.com/watch?v=AnsXWH2_EBU", "title": "How Anthropic Merges 30,000 Code Changes a Day - Manish Kapur, Sonar & Addy Osmani, Anthropic", "channel": "AI Engineer", "duration": "约 19 分钟", "published": "2026-10-28", "slot": "day", "summary": "Sonar 的 Manish Kapur 和 Anthropic 的 Addy Osmani 聊到，coding agent 提 PR 的速度已经远超人能 review 的速度。Anthropic 每天合并的改动从约 2,500 个涨到了 30,000 个。做法是让 Claude 先做第一轮 review，而且每条 review 都得附上真实的验证证据。核心观点：「写代码基本解决了，难的是有没有信心合并」，所以每个环节都需要独立、多层的验证。", "why": "agent 产出变多以后，人要怎么建立信任，这本身就是 Happycapy 要解决的产品设计问题。", "difficulty": "中等偏上。口音清楚，但 PR、sandbox、verification 这类工程术语比较密。", "expressions": [], "summary_quality": "full"}, {"id": "yj90StgN70w", "url": "https://www.youtube.com/watch?v=yj90StgN70w", "title": "Make your Figma design system agent-ready", "channel": "Figma", "duration": "约 8 分钟", "published": "2026-10-28", "slot": "day", "summary": "讲怎么让 Figma agent 生成的设计「像你自己的产品」。关键是给 agent 一套它看得懂的 design system：组件结构清晰、命名一致、文档完整，再补上专门写给 agent 的示例、规范和 skills。视频里还演示了让 agent 批量重命名图层。", "why": "短、实用，设计师看完就能直接用上。", "difficulty": "较低。官方教程的语速，设计词汇都熟。", "expressions": [], "summary_quality": "full"}, {"id": "iMsUcCYNKqY", "url": "https://www.youtube.com/watch?v=iMsUcCYNKqY", "title": "Why Sam Altman is against a single superintelligence", "channel": "Cheeky Pint", "duration": "约 53 分钟", "published": "2026-10-29", "slot": "night", "summary": "Stripe 联合创始人 John Collison 采访 Sam Altman。核心观点：① AI 找漏洞会越来越多，打补丁不够，更持久的是重写软件架构；② 沙盒锁不住超人级模型，路线是沙盒→监控（含 activation monitoring）→真正对齐；③ 反对单一超级智能，更看好 agent teams（不喜欢说 swarm）：多 agent 并行校验提升能力，也更接近社会多元制衡；④ OpenAI「数学周末」把新模型砸向 Navier–Stokes 等难题，agent teams 的 scaling 还刚起步，成本有望一年降到约 1/100；⑤ 基础科学发现该公开，同时要对科学家社区有体谅；⑥ 站在算力通缩一边，希望每吉瓦五年 TCO 从约 700 亿降到约 200 亿美元，并考虑用机器人建数据中心；⑦ 个人 agent（Dot、Muse、Grok Bot 等）还没到「Macintosh 时刻」，但会逐步取代网页表单和很多手机 App，真正护城河是品牌/履约/选品；⑧ 迭代部署是唯一靠谱路径；企业多数仍是 AI 用得不够；讨厌用 tokens 计价但客户要可预期；好模型要会科学发现，也要「好共事」——像会认真反驳却仍尊重你的资深同事。", "why": "「agent teams」与「agent 取代表单/App」和 Happycapy 的 agent-native computer 方向直接相关。", "difficulty": "中等。聊得比较放松，Sam 语速偏快，John 是爱尔兰口音。", "expressions": [], "summary_quality": "full"}, {"id": "EZcWEsMuLb4", "url": "https://www.youtube.com/watch?v=EZcWEsMuLb4", "title": "Taking on ServiceNow: Coding Agents for the Rest of Us with Serval Co-Founder and CEO Jake Stauch", "channel": "No Priors: AI, Machine Learning, Tech, & Startups", "duration": "约 38 分钟", "published": "2026-10-29", "slot": "extra", "summary": "Serval 的 CEO Jake Stauch 讲他们怎么把 coding agent 交给企业 IT 团队，让不写代码的人也能搭东西，同时靠确定性的审批流程和审计记录管住权限。他的判断是 SaaS 不会崩，更可能迎来一轮整合；后台自动运行的 agent 在企业里目前还算 moonshot。", "why": "企业里「给非工程师用 agent + 审批审计」的产品形态可参考。", "difficulty": "中等。美式口音，语速平稳，商业词汇比较多。", "expressions": [], "summary_quality": "full"}], "expressions": [{"en": "first-pass review", "zh": "第一轮初审，之后还会有人复核"}, {"en": "dark software factory", "zh": "几乎不需要人在场、全自动运转的软件工厂；说法来自 lights-out factory（熄灯工厂）"}, {"en": "test-time compute", "zh": "模型在推理、回答问题时额外投入的算力"}, {"en": "system of record", "zh": "企业里作为权威数据来源的核心系统，比如 ServiceNow、Salesforce"}, {"en": "SaaS-pocalypse", "zh": "SaaS 和 apocalypse 拼成的词，指 AI 会让传统 SaaS 遭遇末日的说法"}], "day_assignment": "confirmed"}, {"date": "2026-10-29", "items": [{"id": "hnCoQ5wB-GU", "url": "https://www.youtube.com/watch?v=hnCoQ5wB-GU", "title": "I tested 4 AI agents on 9 real tasks. Here’s who won.", "channel": "How I AI", "duration": "约 35 分钟", "published": "2026-10-28", "slot": "day", "summary": "Claire Vo（How I AI）谈 personal-agent fatigue，横评 Grok Bot、ChatGPT Dot、Meta Muse、Claude Duet。用 9 个真实任务打分：回 Slack、修 Sentry bug、Figma 缩略图、收件箱、家庭小报、四年级物理题、买鞋、发布视频等；还用 computer use 让一个 agent 去操作这些 agent 再打分。", "why": "Happycapy 竞品实测，评测任务设计可参考。", "difficulty": "中等。", "expressions": [], "summary_quality": "full"}, {"id": "9v42ZOdiBJY", "url": "https://www.youtube.com/watch?v=9v42ZOdiBJY", "title": "Why     const main = document.getElementById("main");
    const dayNav = document.getElementById("day-nav");
    const qInput = document.getElementById("q");
    let slot = "all";
    let onlyFull = false;
    let dayFilter = "all";
    let query = "";

    const slotLabel = { day: "Day", night: "Night", extra: "Extra" };
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function fmtDateShort(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}`;
    }

    function fmtDateHeading(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}, ${y}`;
    }

    function matchItem(item, day) {
      if (slot !== "all" && item.slot !== slot) return false;
      if (onlyFull && item.summary_quality !== "full") return false;
      if (dayFilter !== "all" && day.date !== dayFilter) return false;
      if (query) {
        const hay = [item.title, item.channel, item.summary, item.why, item.difficulty, day.date].join(" ").toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function formatDuration(d) {
      if (d == null || d === "") return "duration TBD";
      const s = String(d).trim();
      const m = s.match(/^约\s*(\d+)\s*分钟$/);
      if (m) return `~${m[1]} min`;
      return s;
    }

    function embedSrc(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1`;
    }

    function iframeHtml(id) {
      return `<iframe src="${embedSrc(id)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    }

    function mountEmbed(box) {
      if (!box || box.querySelector("iframe")) return;
      const id = box.dataset.vid;
      if (!id) return;
      box.innerHTML = iframeHtml(id);
    }

    function clearEmbed(box) {
      if (box) box.innerHTML = "";
    }


    function summaryDek(item, thin) {
      if (thin) return `<p class="dek pending">Summary still catching up — open the video meanwhile.</p>`;
      const raw = String(item.summary || "").trim();
      // Prefer first 1–2 sentences for the always-visible dek
      let dek = raw;
      const parts = raw.split(/(?<=[。！？.!?])\s*/);
      if (parts.length > 2) dek = parts.slice(0, 2).join("");
      return `<p class="dek">${escapeHtml(dek)}</p>`;
    }

    function render() {
      dayNav.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.textContent = "All dates";
      allBtn.className = dayFilter === "all" ? "active" : "";
      allBtn.onclick = () => { dayFilter = "all"; render(); };
      dayNav.appendChild(allBtn);

      main.innerHTML = "";

      DATA.days.forEach(day => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = fmtDateShort(day.date);
        btn.className = dayFilter === day.date ? "active" : "";
        btn.onclick = () => { dayFilter = day.date; render(); };
        dayNav.appendChild(btn);

        const items = day.items.filter(it => matchItem(it, day));
        if (!items.length) return;

        const block = document.createElement("section");
        block.className = "day-block";
        block.id = "day-" + day.date;
        const h2 = document.createElement("h2");
        const approx = day.day_assignment && String(day.day_assignment).startsWith("approximate");
        h2.innerHTML = escapeHtml(fmtDateHeading(day.date)) +
          (approx ? ` <span>Date approximate</span>` : "");
        block.appendChild(h2);

        items.forEach(item => {
          const card = document.createElement("article");
          card.className = "card slot-" + (item.slot || "");
          card.dataset.id = item.id;
          const thin = item.summary_quality !== "full";
          const whyBlock = (!thin && item.why)
            ? `<p class="label why">Why watch</p><p>${escapeHtml(item.why)}</p>`
            : "";
          const diffBlock = (!thin && item.difficulty)
            ? `<p class="label level">English level</p><p>${escapeHtml(item.difficulty)}</p>`
            : "";
          const fullSummaryBlock = (!thin && item.summary)
            ? `<p>${escapeHtml(item.summary)}</p>`
            : (thin ? `<p class="pending">Summary still catching up — open the video meanwhile.</p>` : "");
          card.innerHTML = `
            <div class="card-head">
              <span class="slot-chip ${item.slot}" aria-label="${slotLabel[item.slot] || item.slot}">${slotLabel[item.slot] || item.slot}</span>
              <span class="quality-chip ${thin ? "thin" : "full"}">${thin ? "Pending" : "Full"}</span>
            </div>
            <h3><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
            <p class="meta">${escapeHtml(item.channel)} · ${escapeHtml(formatDuration(item.duration))}` +
              (item.published ? ` · ${escapeHtml(item.published)}` : "") + `</p>
            ${summaryDek(item, thin)}
            <div class="actions">
              <button type="button" class="primary" data-act="toggle">Collapse</button>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener">Open on YouTube ↗</a>
            </div>
            <div class="detail open" id="d-${item.id}">
              <div class="video" data-vid="${escapeHtml(item.id)}"></div>
              ${fullSummaryBlock}
              ${whyBlock}
              ${diffBlock}
            </div>`;
          block.appendChild(card);
          mountEmbed(card.querySelector(".video"));
        });

        if (day.expressions && day.expressions.length && items.length) {
          const ex = document.createElement("div");
          ex.className = "day-expr";
          ex.innerHTML = `<h4>Expressions</h4><ul class="expr">` +
            day.expressions.map(e => `<li><strong>${escapeHtml(e.en)}</strong> — ${escapeHtml(e.zh)}</li>`).join("") +
            `</ul>`;
          block.appendChild(ex);
        }

        main.appendChild(block);
      });

    }

    main.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act=toggle]");
      if (!btn) return;
      const card = btn.closest(".card");
      const detail = card.querySelector(".detail");
      const open = detail.classList.toggle("open");
      btn.textContent = open ? "Collapse" : "Expand";
      const box = detail.querySelector(".video");
      if (open) {
        mountEmbed(box);
      } else {
        clearEmbed(box);
      }
    });

    document.querySelectorAll(".slot-nav button[data-slot]").forEach(b => {
      b.addEventListener("click", () => {
        slot = b.dataset.slot;
        document.querySelectorAll(".slot-nav button[data-slot]").forEach(x => x.classList.toggle("active", x === b));
        render();
      });
    });
    document.querySelector(".slot-nav button[data-quality]").addEventListener("click", (e) => {
      onlyFull = !onlyFull;
      e.currentTarget.classList.toggle("active", onlyFull);
      render();
    });
    qInput.addEventListener("input", () => {
      query = qInput.value.trim().toLowerCase();
      render();
    });

    const SIDE_KEY = "victoria-listening-sidebar";
    const sideToggle = document.getElementById("side-toggle");
    function setSidebarCollapsed(collapsed, persist) {
      document.documentElement.classList.toggle("side-collapsed", collapsed);
      sideToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      sideToggle.setAttribute("aria-label", collapsed ? "Show filters" : "Hide filters");
      if (persist) {
        try { localStorage.setItem(SIDE_KEY, collapsed ? "collapsed" : "expanded"); } catch (e) {}
      }
    }
    setSidebarCollapsed(document.documentElement.classList.contains("side-collapsed"), false);
    sideToggle.addEventListener("click", () => {
      setSidebarCollapsed(!document.documentElement.classList.contains("side-collapsed"), true);
    });

    render();

  </script>
